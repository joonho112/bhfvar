name: release-gate

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check-and-stan-parity:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      BHFVAR_RUN_STAN_PARITY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: 1
      - name: Run frozen native Stan oracle parity
        shell: Rscript {0}
        run: testthat::test_local(filter = "stan-oracle-parity")
      - name: Build source package with vignettes
        shell: bash
        run: R CMD build .
      - name: Run CRAN-style source check
        shell: bash
        run: |
          tarball=$(find . -maxdepth 1 -name 'bhfvar_*.tar.gz' -print -quit)
          test -n "$tarball"
          R CMD check --no-manual --as-cran "$tarball"
